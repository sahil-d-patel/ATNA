name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check src tests scripts

      # The BTS extracts are large and not redistributable, so CI runs the same
      # pipeline against the synthetic demo snapshot. This exercises ETL, metrics,
      # and scenarios end to end rather than only the import-safe unit tests.
      - name: Generate demo snapshot
        run: PYTHONPATH=src python scripts/demo/generate_demo_data.py --force

      - name: Run pipeline
        run: |
          PYTHONPATH=src python -m etl.run_pipeline
          PYTHONPATH=src python -m metrics.run_metrics
          PYTHONPATH=src python -m scenarios.run_scenarios

      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests -q
